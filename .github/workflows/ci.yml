name: PromptForge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --select E4,E7,E9,F src/ tests/

      - name: Type check (mypy)
        run: mypy src/promptforge

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src/promptforge --cov-report=term-missing

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v

      # The fixed filelock 4.2.1+ requires Python >= 3.11. Keep testing
      # runtime compatibility on 3.10, but audit supported patched environments.
      - name: Upgrade vulnerable audit dependencies
        if: matrix.python-version != '3.10'
        run: python -m pip install --upgrade "setuptools>=84.1.0" "filelock>=4.2.1"

      - name: Security audit (Python 3.11+)
        if: matrix.python-version != '3.10'
        run: pip-audit

      - name: Report Python 3.10 security-audit limitation
        if: matrix.python-version == '3.10'
        run: |
          echo "::warning::Python 3.10 tested for correctness but full environment audit cannot pass: fixed filelock >=4.2.1 requires Python >=3.11. Do not use vulnerable developer tooling in production."

  eval-smoke:
    name: Eval Smoke Test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate quickstart prompt and dataset (offline)
        run: |
          cd examples/quickstart
          promptforge validate \
            --prompt prompts/summarizer.yaml \
            --dataset datasets/summarizer_golden.yaml